<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANI OS - پلتفرم شخصی‌سازی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 80px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #a0a0c0;
            font-size: 1rem;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 20px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-item:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.12);
        }

        .menu-item .info {
            flex: 1;
            text-align: right;
        }

        .menu-item .title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .menu-item .desc {
            font-size: 0.8rem;
            color: #a0a0c0;
        }

        .menu-item .arrow {
            color: #f7971e;
            font-size: 20px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #f7971e, #ffd200);
            border: none;
            border-radius: 14px;
            padding: 16px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            display: none;
            font-size: 0.95rem;
            border-right: 3px solid #f7971e;
        }

        .footer {
            margin-top: 30px;
            color: #606080;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">🚀</div>
        <h1>DANI OS</h1>
        <p class="subtitle">پلتفرم شخصی‌سازی حرفه‌ای</p>

        <!-- ===== منوی اصلی با آدرس‌های درست ===== -->
        <!-- ربات‌ها -->
        <div class="menu-item" onclick="window.location.href='telegram-bot/bot.js'">
            <span class="arrow">←</span>
            <div class="info">
                <div class="title">🤖 ربات‌ها</div>
                <div class="desc">ساخت و مدیریت ربات‌های تلگرام</div>
            </div>
        </div>

        <!-- بازی‌ها (داخل پوشه dani-world) -->
        <div class="menu-item" onclick="window.location.href='dani-world/index.html'">
            <span class="arrow">←</span>
            <div class="info">
                <div class="title">🎮 بازی‌ها</div>
                <div class="desc">ساخت بازی‌های سه‌بعدی و شهرسازی</div>
            </div>
        </div>

        <!-- برنامه‌ساز -->
        <div class="menu-item" onclick="window.location.href='app-builder.html'">
            <span class="arrow">←</span>
            <div class="info">
                <div class="title">📱 برنامه‌ساز</div>
                <div class="desc">ساخت و مدیریت برنامه‌های شخصی</div>
            </div>
        </div>

        <button class="btn-primary" onclick="newProject()">➕ پروژه جدید</button>

        <div id="status">
            <div id="statusMessage"></div>
        </div>

        <div class="footer">© 2026 DANI OS · v2.0</div>
    </div>

    <script>
        function newProject() {
            const status = document.getElementById('status');
            const msg = document.getElementById('statusMessage');
            const projectName = prompt('📝 لطفاً نام پروژه جدید را وارد کنید:');

            if (projectName === null) {
                return;
            }

            if (projectName.trim() === '') {
                alert('❌ لطفاً یک نام معتبر وارد کنید!');
                return;
            }

            status.style.display = 'block';
            msg.innerHTML = `⏳ در حال ساخت پروژه "${projectName}"...`;

            setTimeout(() => {
                msg.innerHTML = `✅ پروژه "${projectName}" با موفقیت ساخته شد! 🎉`;
                msg.innerHTML += `<br><span style="font-size:0.85rem; color:#a0a0c0;">🔗 لینک پروژه: /projects/${projectName.toLowerCase().replace(/\s/g, '-')}</span>`;
            }, 1500);
        }

        window.onload = function() {
            console.log('🚀 DANI OS v2.0 Loaded!');
        };
    </script>

</body>
              </html>
