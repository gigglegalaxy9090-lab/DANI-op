<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANI OS - Personal Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .logo {
            font-size: 80px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #a0a0c0;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .menu-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-10px);
            border-color: #f7971e;
        }
        .menu-item .icon {
            font-size: 30px;
        }
        .menu-item .title {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .menu-item .desc {
            font-size: 0.9rem;
            color: #a0a0c0;
        }
        .menu-item .arrow {
            color: #f7971e;
            font-size: 20px;
        }
        .btn {
            background: linear-gradient(90deg, #f7971e, #ffd200);
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            width: 100%;
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(247, 151, 30, 0.3);
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            display: none;
            font-size: 0.95rem;
        }
        .footer {
            margin-top: 30px;
            color: #606080;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚀</div>
        <h1>DANI OS</h1>
        <p class="subtitle">پلتفرم شخصی‌سازی حرفه‌ای</p>

        <div class="menu">
            <div class="menu-item" onclick="showSection('bots')">
                <div>
                    <div class="title">🤖 ربات‌ها</div>
                    <div class="desc">ساخت و مدیریت ربات‌های تلگرام</div>
                </div>
                <span class="arrow">→</span>
            </div>
            <div class="menu-item" onclick="showSection('games')">
                <div>
                    <div class="title">🎮 بازی‌ها</div>
                    <div class="desc">ساخت بازی‌های سه‌بعدی</div>
                </div>
                <span class="arrow">→</span>
            </div>
            <div class="menu-item" onclick="showSection('apps')">
                <div>
                    <div class="title">📱 برنامه‌ها</div>
                    <div class="desc">ساخت برنامه‌های وب</div>
                </div>
                <span class="arrow">→</span>
            </div>
        </div>

        <button class="btn" onclick="createProject()">➕ پروژه جدید</button>

        <div id="status">
            <div id="statusMessage"></div>
        </div>

        <div class="footer">© 2026 DANI OS · v2.0</div>
    </div>

    <script>
        function showSection(section) {
            const status = document.getElementById('status');
            const msg = document.getElementById('statusMessage');
            const titles = {
                bots: '🤖 وارد شدن به بخش ربات‌ها...',
                games: '🎮 وارد شدن به بخش بازی‌ها...',
                apps: '📱 وارد شدن به بخش برنامه‌ها...'
            };
            status.style.display = 'block';
            msg.innerHTML = `${titles[section]} ✅`;
            setTimeout(() => {
                msg.innerHTML = `✅ ${titles[section]} (اتصال به سرور)`;
            }, 1000);
        }

        function createProject() {
            const status = document.getElementById('status');
            const msg = document.getElementById('statusMessage');
            const name = prompt('نام پروژه جدید:');
            if (name) {
                status.style.display = 'block';
                msg.innerHTML = `🚀 پروژه "${name}" در حال ساخت...`;
                setTimeout(() => {
                    msg.innerHTML = `✅ پروژه "${name}" با موفقیت ساخته شد!`;
                }, 1500);
            }
        }
    </script>
</body>
  </html>
